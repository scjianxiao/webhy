name: AI Auto Review & Summary

on:
  # 1. 定时触发：每天 UTC 时间 18:00 运行（适合每日总结）
  schedule:
    - cron: '0 18 * * *'
  # 2. 手动触发：方便调试 Prompt 或临时执行
  workflow_dispatch:
    inputs:
      custom_prompt:
        description: '自定义 AI 任务指令 (可选)'
        required: false
        default: 'Summarize recent changes and identify potential bugs.'
      days_to_review:
        description: '回顾过去几天的代码 (默认 1 天)'
        required: false
        default: '1'

# 权限设置：遵循最小权限原则
permissions:
  contents: read       # 允许读取代码和 Git 历史
  issues: write        # 允许 AI 创建 Issue (如果需要)
  actions: read        # 允许读取工作流状态

jobs:
  ai-analysis:
    runs-on: ubuntu-latest
    steps:
      # --- 步骤 1: 环境准备 ---
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须获取完整 Git 历史，以便 AI 分析变更

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Copilot CLI 需要较新的 Node 版本

      # --- 步骤 2: 安装与认证 ---
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      # --- 步骤 3: 准备上下文数据 (可选优化) ---
      # 提前获取 Git Log，作为 Prompt 的一部分传入，比让 AI 自己执行 git 命令更稳定
      - name: Get Recent Git Changes
        id: git_changes
        run: |
          DAYS=${{ github.event.inputs.days_to_review || '1' }}
          SINCE_DATE=$(date -d "$DAYS days ago" +%Y-%m-%d)
          echo "Fetching changes since $SINCE_DATE..."
          
          # 获取简短日志
          GIT_LOG=$(git log --since="$SINCE_DATE" --pretty=format:"%h - %an, %ar : %s" --no-merges)
          
          # 获取具体文件变更统计
          GIT_STATS=$(git diff --stat "@{$SINCE_DATE}" HEAD)
          
          # 将结果保存为环境变量，供后续步骤使用
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$GIT_LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "stats<<EOF" >> $GITHUB_OUTPUT
          echo "$GIT_STATS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # --- 步骤 4: 运行 AI 分析 ---
      - name: Run Copilot Analysis
        env:
          # 使用 GitHub Token 进行鉴权
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_PROMPT: ${{ github.event.inputs.custom_prompt }}
          GIT_LOG: ${{ steps.git_changes.outputs.log }}
          GIT_STATS: ${{ steps.git_changes.outputs.stats }}
        run: |
          # 构建动态 Prompt
          if [ -z "$CUSTOM_PROMPT" ]; then
            PROMPT="You are a senior code reviewer. Analyze the following Git changes from the last 24 hours. 
            1. Summarize the key functional changes.
            2. Identify any potential security risks or bug-prone areas.
            3. Suggest improvements for code quality.
            
            Here is the Git Log:
            $GIT_LOG
            
            Here is the File Change Stats:
            $GIT_STATS
            
            Output the result in clean Markdown format."
          else
            PROMPT="$CUSTOM_PROMPT. Context: Recent Git Log: $GIT_LOG"
          fi

          # 执行 Copilot CLI
          # --allow-tool='shell(git:*)': 允许只读 Git 命令 (虽然我们已经传入了日志，但保留以防 AI 需要查证)
          # --allow-tool=write: 允许写入文件 (用于生成报告)
          # --no-ask-user: 非交互模式，适合自动化
          copilot -p "$PROMPT" \
            --allow-tool='shell(git:*)' \
            --allow-tool=write \
            --no-ask-user > ai_report.md

      # --- 步骤 5: 处理结果 ---
      - name: Display Report in Summary
        run: |
          echo "## 🤖 AI Analysis Report" >> $GITHUB_STEP_SUMMARY
          cat ai_report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-report-${{ github.run_id }}
          path: ai_report.md
          retention-days: 7

      # --- 步骤 6: 可选 - 自动创建 Issue (如果发现严重问题) ---
      # 这里使用简单的 grep 检查报告中是否包含"Critical"或"Security"关键词
      - name: Create Issue if Critical Issues Found
        if: contains(github.steps['Run Copilot Analysis'].outputs.stdout, 'Critical') || contains(github.steps['Run Copilot Analysis'].outputs.stdout, 'Security Risk')
        run: |
          gh issue create \
            --title "🚨 AI Detected Potential Critical Issues" \
            --body "Automated review found potential critical issues. See attached report." \
            --label "bug,security"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
